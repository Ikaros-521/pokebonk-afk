<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { width: 230px; margin: 0; padding: 12px; font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #161622; color: #eee; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; border: none; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; background: #2fae4f; color: #fff; }
  button:active { filter: brightness(.88); }
  p { margin: 10px 0 0; opacity: .68; font-size: 12px; }
</style>
</head>
<body>
  <h1>🧲 PokéBonk 挂机助手</h1>
  <button id="toggle">▶ / ⏹ 启动 / 停止挂机</button>
  <p>需要 PokéBonk 页面已打开。效果等同在页面按 <b>F8</b>。<br>页面右上角有控制面板，<b>F9</b> 显隐。</p>
  <script src="popup.js"></script>
</body>
</html>
